<!DOCTYPE html>
<html>
<head>
  <title>API Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; background: #1e1e2e; color: #cdd6f4; }
    input { width: 300px; padding: 8px; border-radius: 6px; border: 1px solid #45475a; background: #181825; color: white; margin-bottom: 10px; }
    button { padding: 8px 16px; border-radius: 6px; border: none; background: #89b4fa; color: #11111b; font-weight: bold; cursor: pointer; }
    button:hover { background: #b4befe; }
  </style>
</head>
<body>
  <h3>⚡ Gemini API Setup</h3>
  <p>Paste your free API key from Google AI Studio:</p>
  <input type="password" id="apiKey" placeholder="AIzaSy...">
  <br>
  <button id="save">Save Key</button>

  <script>
    // Load existing key
    chrome.storage.local.get("geminiKey", (data) => {
      if (data.geminiKey) document.getElementById('apiKey').value = data.geminiKey;
    });

    // Save new key
    document.getElementById('save').addEventListener('click', () => {
      const key = document.getElementById('apiKey').value.trim();
      chrome.storage.local.set({ geminiKey: key }, () => {
        alert('API Key Saved Successfully!');
      });
    });
  </script>
</body>
</html>
